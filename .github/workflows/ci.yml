name: LifePod CI and previews

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifepod-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web lint, seating tests, and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:web
      # The board's type is system-ui, which is Roboto on Android. Ubuntu falls back to the much wider DejaVu
      # Sans, which would make badge-fit and auto-drop tests measure text no phone shows.
      - name: Use Roboto as the system font, like Android
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-roboto
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f
          fc-match system-ui
          fc-match sans-serif
      - name: Check seat layouts in Chromium
        run: |
          npx playwright-core install --only-shell chromium
          npm test -- --test-name-pattern=chromium
      - name: Bundle offline web app
        working-directory: web
        run: zip "$RUNNER_TEMP/lifepod-web.zip" index.html app.js dice.js styles.css icon.png favicon-32.png fonts/mana.woff2 fonts/OFL.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lifepod-web
          path: ${{ runner.temp }}/lifepod-web.zip
          if-no-files-found: error

  android:
    name: Android ktlint, Android Lint, APK, and App Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android SDK packages are available
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.1.0/aapt2" ||
                ! -x "$ANDROID_HOME/cmdline-tools/23.0/bin/lint" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.1.0' 'cmdline-tools;23.0'
          fi
      - name: Install Kotlin 2.2.21, ktlint 1.8.0, and bundletool 1.18.3
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip
          curl --fail --location --retry 3 --silent --show-error \
            -o ktlint https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint
          curl --fail --location --retry 3 --silent --show-error \
            -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          sha256sum --check <<'CHECKSUMS'
          a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714  kotlin.zip
          a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  ktlint
          a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar
          CHECKSUMS
          unzip -q kotlin.zip
          chmod +x ktlint
          printf '%s\n' "$RUNNER_TEMP/kotlinc/bin" "$RUNNER_TEMP" >> "$GITHUB_PATH"
          printf 'LIFE_POD_BUNDLETOOL=%s\n' "$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - run: ktlint 'android/src/**/*.kt'
      - name: Android Lint
        run: ./android/lint.sh
      - if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: android-lint-report
          path: android/build/lint-report.html
          if-no-files-found: ignore
      - name: Build Android APK and App Bundle
        id: build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 || '' }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD || '' }}
        run: |
          apk=android/build/lifepod-debug.apk
          aab=android/build/lifepod-debug.aab
          play_ready=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo '::error::Use a version tag such as v0.1.0-alpha.1.'
              exit 1
            fi
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
              echo '::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets before publishing an Android release.'
              exit 1
            fi
            keys=$(mktemp -d "$RUNNER_TEMP/lifepod-keys.XXXXXXXX")
            trap 'rm -rf "$keys"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keys/release.p12"
            export LIFE_POD_KEYSTORE="$keys/release.p12"
            export LIFE_POD_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export LIFE_POD_VERSION_CODE="$GITHUB_RUN_NUMBER"
            export LIFE_POD_VERSION_NAME="${GITHUB_REF_NAME#v}"
            apk=android/build/lifepod.apk
            if [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" && -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ]]; then
              printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keys/upload.p12"
              export LIFE_POD_UPLOAD_KEYSTORE="$keys/upload.p12"
              export LIFE_POD_UPLOAD_KEYSTORE_PASSWORD="$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
              aab=android/build/lifepod.aab
              play_ready=true
            else
              echo '::notice::No Google Play upload key is set, so this release will not be uploaded to Google Play.'
            fi
          fi
          ./android/build.sh
          { printf 'apk=%s\n' "$apk"; printf 'aab=%s\n' "$aab"; printf 'play_ready=%s\n' "$play_ready"; } >> "$GITHUB_OUTPUT"
      - name: Verify APK signature and App Bundle
        env:
          APK: ${{ steps.build.outputs.apk }}
          AAB: ${{ steps.build.outputs.aab }}
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$APK"
          java -jar "$LIFE_POD_BUNDLETOOL" validate --bundle="$AAB" > /dev/null
          # Android keys are self-signed, so check that the bundle is signed rather than trusted by a CA.
          jarsigner -verify "$AAB" | grep -q '^jar verified'
          unzip -l "$AAB" | grep -Eq 'META-INF/[^/]+\.(RSA|EC)$'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lifepod-android
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: android-bundle
          path: ${{ steps.build.outputs.aab }}
          if-no-files-found: error
    outputs:
      play_ready: ${{ steps.build.outputs.play_ready }}

  ios:
    name: iOS lint, WebKit seating tests, and builds
    # Xcode 27 (iOS 27 SDK) is on GitHub's preview image; move to the standard macOS runner once it ships Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check seat layouts in WebKit
        run: |
          npx playwright-core install webkit
          npm test -- --test-name-pattern=webkit
      - name: Show the Xcode and iOS SDK in use
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: xcrun swift-format lint --strict ios/LifePodApp.swift
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project ios/LifePod.xcodeproj -scheme LifePod -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build/Simulator \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone
        run: |
          xcodebuild -project ios/LifePod.xcodeproj -scheme LifePod -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/build/Device \
            CODE_SIGNING_ALLOWED=NO build
      - name: Bundle simulator app
        run: |
          ditto -c -k --keepParent ios/build/Simulator/Build/Products/Debug-iphonesimulator/LifePod.app \
            "$RUNNER_TEMP/lifepod-ios-simulator.zip"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lifepod-ios-simulator
          path: ${{ runner.temp }}/lifepod-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [web, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: lifepod-*
          path: assets
          merge-multiple: true
      - name: Publish preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "LifePod $GITHUB_REF_NAME" --verify-tag --prerelease --generate-notes \
            --notes 'Signed Android APK for Obtainium, iOS Simulator app, and offline web bundle.' \
            assets/lifepod.apk assets/lifepod-ios-simulator.zip assets/lifepod-web.zip

  google-play:
    name: Upload to Google Play
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.android.outputs.play_ready == 'true'
    needs: [web, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check for the Google Play service account
        id: account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo '::notice::Set PLAY_SERVICE_ACCOUNT_JSON to upload tagged releases to Google Play.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.account.outputs.ready == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: android-bundle
          path: bundle
      # A draft release on the internal track by default. Set the PLAY_TRACK and PLAY_RELEASE_STATUS
      # repository variables to change that, for example to "production" and "completed".
      - if: steps.account.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.maceiras.lifepod
          releaseFiles: bundle/lifepod.aab
          releaseName: ${{ github.ref_name }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [web, android, ios]
    # App Store Connect requires the iOS 27 SDK from April 2027.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check for the App Store Connect key
        id: key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [[ -z "$APP_STORE_CONNECT_API_KEY" || -z "$APPLE_TEAM_ID" || -z "$APP_STORE_CONNECT_KEY_ID" || -z "$APP_STORE_CONNECT_ISSUER_ID" ]]; then
            echo '::notice::Set the APP_STORE_CONNECT_API_KEY secret and the APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, and APP_STORE_CONNECT_ISSUER_ID variables to upload tagged releases to TestFlight.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # App Store versions are numbers only, so v0.1.0-alpha.3 uploads as version 0.1.0 with the run number as
      # its build number.
      - name: Show the Xcode and iOS SDK in use
        if: steps.key.outputs.ready == 'true'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Archive and upload
        if: steps.key.outputs.ready == 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key=$(mktemp "$RUNNER_TEMP/AuthKey.XXXXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$key"
          version="${GITHUB_REF_NAME#v}"
          export APP_STORE_CONNECT_KEY_PATH="$key"
          export LIFE_POD_VERSION_NAME="${version%%-*}"
          export LIFE_POD_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          ./ios/upload-testflight.sh
