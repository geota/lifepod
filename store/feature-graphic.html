<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LifePod feature graphic</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1024px; height: 500px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 430px 1fr;
      align-items: center;
      background: radial-gradient(circle at 18% 30%, #2b3a25 0, #141916 62%);
      color: #f3f1e5;
      font: 16px/1.3 system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    }
    .brand { padding-left: 64px; }
    .brand img { display: block; width: 104px; height: 104px; margin-bottom: 26px; border-radius: 24px; }
    h1 { font-size: 64px; font-weight: 750; letter-spacing: -.04em; line-height: 1; }
    p { margin-top: 16px; max-width: 320px; color: #bcc7b8; font-size: 24px; font-weight: 550; letter-spacing: -.01em; }
    .board {
      width: 600px;
      transform: rotate(-4deg) translateX(12px);
      border: 6px solid #0d110e;
      border-radius: 22px;
      box-shadow: 0 30px 70px #050806cc;
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="../ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="">
    <h1>LifePod</h1>
    <p>Ad-free, offline life counter for 2–6 players</p>
  </div>
  <img class="board" src="play/phone/01-four-players.png" alt="">
</body>
</html>
